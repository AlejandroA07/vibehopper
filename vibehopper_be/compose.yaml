services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vibehopper-postgres
    environment:
      POSTGRES_DB: vibehopperdb
      POSTGRES_USER: vibehopper
      POSTGRES_PASSWORD: vibehopper
    ports:
      - "5432:5432"
    volumes:
      - vibehopper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibehopper -d vibehopperdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vibehopper-postgres-data:
