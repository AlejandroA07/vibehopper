spring:
  application:
    name: vibehopper
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/vibehopperdb}
    username: ${POSTGRES_USER:vibehopper}
    password: ${POSTGRES_PASSWORD:vibehopper}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

vibehopper:
  security:
    jwt:
      secret: ${JWT_SECRET_KEY:}
      expiration: ${JWT_EXPIRATION:24h}
  cors:
    allowed-origins: ${FRONTEND_CORS_ORIGINS:http://localhost:5173}
